<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body>
    <script src="solver.js?v=20261105_flat_v5"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            console.log("=== STARTING DIRECT SOLVER HEADCOUNT TEST ===");
            
            // 20名のスタッフを作成。うち1名を isHalf = true (0.5トグルON) にする
            const staffList = [];
            for (let i = 0; i < 20; i++) {
                staffList.push({
                    id: i + 1,
                    name: "スタッフ " + (i + 1),
                    isUnused: false,
                    isHalf: (i === 3), // ★ No.4のスタッフが 0.5 (時短)
                    isFullTime: false,
                    allow6Consec: false,
                    section: "PT A",
                    prevDays: ['', '', '', '', ''],
                    days: new Array(28).fill('')
                });
            }

            // STスタッフも2名（1名は isHalf = true）
            // stDailyHeadCount: 毎日2名出勤 (頭数: 2.0)
            // stDailyWork: 1名は0.5なので (実数: 1.5)
            const stDailyHeadCount = new Array(28).fill(2.0);
            const stDailyWork = new Array(28).fill(1.5);

            const dates = [];
            for (let d = 0; d < 28; d++) {
                dates.push({ label: (d + 1) + "日", day: d + 1, m: 4 });
            }

            const scheduler = new ShiftScheduler(staffList, {
                standardHolidays: 8.0,
                dates: dates,
                dayOffsets: new Array(28).fill(0),
                isST: false,
                isSouth: false,
                isLife: false,
                stDailyWork: stDailyWork,
                stDailyHeadCount: stDailyHeadCount
            });

            // 基本勤務表を生成
            const res = scheduler.solveBaseSchedule({ force: true });
            console.log("SOLVE_SUCCESS: " + res.success);

            // 統計を集計
            const stats = scheduler.calculateStats();

            let nonIntTotalWork = 0;
            let decimalRealWork = 0;
            stats.daily.forEach((d, idx) => {
                if (d.totalWork % 1 !== 0) nonIntTotalWork++;
                if (d.realWork % 1 !== 0) decimalRealWork++;
            });

            console.log("RESULT_NON_INT_TOTAL_WORK_COUNT: " + nonIntTotalWork);
            console.log("RESULT_DECIMAL_REAL_WORK_COUNT: " + decimalRealWork);
            console.log("RESULT_DAY_1_TOTAL_WORK: " + stats.daily[0].totalWork);
            console.log("RESULT_DAY_1_REAL_WORK: " + stats.daily[0].realWork);
            console.log("RESULT_ST_SEC_WORK: " + stats.daily[0].sectionWork['ST']);
            console.log("=== HEADCOUNT_TEST_FINISHED ===");
        });
    </script>
</body>
</html>
