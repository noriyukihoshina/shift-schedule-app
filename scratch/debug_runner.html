<!DOCTYPE html>
<html>
<head>
<script>
window.addEventListener('error', (e) => {
    document.getElementById('out').textContent = 'ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
});
</script>
<meta charset="utf-8">
<script>
window.APP_CONFIG = { deptId: 'master', deptName: 'マスターテーブル', floor: '', theme: 'theme-master' };
</script>
<script src="../solver.js"></script>
<script src="../app.js"></script>
</head>
<body><div id="out"></div>
<script>
window.addEventListener('load', () => {
    const stStaff = [];
    for (let i = 1; i <= 36; i++) {
        const fl = (i <= 4) ? '1F' : ((i <= 8) ? '2F' : ((i <= 12) ? '3F' : ((i <= 16) ? '南' : '')));
        const days = new Array(28).fill('');
        if (i === 3) days[0] = '休';
        stStaff.push({
            id: i,
            name: `ST ${String(i).padStart(2, '0')}`,
            isUnused: (i > 16),
            floor: fl,
            section: '',
            can8: false,
            noEarly: false,
            noLate: true,
            canSched: (i % 2 === 1),
            isFullTime: (i === 3 || i === 8 || i === 12 || i === 16),
            days: days,
            prevDays: ['', '', '', '', '']
        });
    }
    const stSched = new ShiftScheduler(stStaff, {
        numDays: 28,
        isST: true,
        standardHolidays: 8.0
    });
    const stResult = stSched.solveST({ force: true, assignSpecial: true });
    
    // 各フロアの出勤人数
    const grid = stResult.grid;
    const dump = [];
    for (let s = 0; s < 16; s++) {
        const syms = grid[s].map(c => c.symbol);
        dump.push({ s, fl: stStaff[s].floor, syms });
    }
    document.getElementById('out').textContent = JSON.stringify(dump);
});
</script>
</body>
</html>
