<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<iframe id="fMaster" src="index.html" style="width: 1400px; height: 800px;"></iframe>
<iframe id="f1F" src="1f.html" style="width: 1400px; height: 800px;"></iframe>
<script>
window.onload = () => {
    setTimeout(() => {
        try {
            const docM = document.getElementById('fMaster').contentDocument;
            const mHeaders = Array.from(docM.querySelectorAll('#masterTable th.col-day-fixed, #masterTable th.header-day-col'));
            const mWidths = mHeaders.map(th => th.offsetWidth);
            console.log('[MASTER_HEADER_WIDTHS]', JSON.stringify(mWidths));

            const mCells = Array.from(docM.querySelectorAll('#masterTable td.col-day-fixed, #masterTable td.day-cell')).slice(0, 28);
            const mCellWidths = mCells.map(td => td.offsetWidth);
            console.log('[MASTER_CELL_WIDTHS]', JSON.stringify(mCellWidths));

            const doc1F = document.getElementById('f1F').contentDocument;
            const fHeaders = Array.from(doc1F.querySelectorAll('th.col-day-fixed, th.header-day-col'));
            const fWidths = fHeaders.map(th => th.offsetWidth);
            console.log('[1F_HEADER_WIDTHS]', JSON.stringify(fWidths));

            const fCells = Array.from(doc1F.querySelectorAll('td.col-day-fixed, td.day-cell')).slice(0, 28);
            const fCellWidths = fCells.map(td => td.offsetWidth);
            console.log('[1F_CELL_WIDTHS]', JSON.stringify(fCellWidths));
        } catch(e) {
            console.log('[MEASURE_ERROR]', e.message);
        }
    }, 2000);
};
</script>
</body>
</html>
