<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<iframe id="fMaster" src="index.html" style="width: 1400px; height: 800px;"></iframe>
<script>
window.onload = () => {
    // Check after load
    setTimeout(() => {
        try {
            const f = document.getElementById('fMaster');
            const doc = f.contentDocument || f.contentWindow.document;
            const headers = Array.from(doc.querySelectorAll('th.col-day-fixed'));
            const headerTexts = headers.map(th => th.innerText.trim()).slice(0, 10);
            const headerWidths = headers.map(th => th.offsetWidth).slice(0, 10);
            console.log('[MASTER_HEADER_TEXTS]', JSON.stringify(headerTexts));
            console.log('[MASTER_HEADER_WIDTHS]', JSON.stringify(headerWidths));

            const cells = Array.from(doc.querySelectorAll('td.col-day-fixed'));
            const cellWidths = cells.map(td => td.offsetWidth).slice(0, 10);
            console.log('[MASTER_CELL_WIDTHS]', JSON.stringify(cellWidths));
        } catch(e) {
            console.log('[VERIFY_ERR]', e.message);
        }
    }, 2500);
};
</script>
</body>
</html>
