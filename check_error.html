<!DOCTYPE html>
<html>
<head><title>Check Error Detail</title></head>
<body>
<div id="errors"></div>
<script>
window.onerror = function(msg, url, line, col, error) {
    document.getElementById('errors').innerHTML += '<div>ERROR: ' + msg + ' at ' + url + ':' + line + ':' + col + ' | stack: ' + (error ? error.stack : 'no stack') + '</div>';
    return false;
};
</script>
