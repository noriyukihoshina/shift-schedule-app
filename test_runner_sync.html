<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<input type="date" id="termStartDate" value="2026-04-01">
<span id="termEndDateDisplay"></span>
<span id="termTitleBadge"></span>
<span id="outputTitleDisplay"></span>
<table><thead id="inputTableHead"></thead><tbody id="inputTableBody"></tbody></table>

<div id="test-log">INIT</div>

<script src="solver.js"></script>
<script src="app.js"></script>
<script>
// app.js の DOMContentLoaded は既に走る
async function runTest() {
    const logs = [];
    function log(msg) { logs.push(msg); }

    try {
        log("1. Init check.");
        // 初期状態確認
        const st2_d5_init = staffList[1].days[4];
        log("2. Initial Staff 2 day 5=" + st2_d5_init);

        // 4/29〜5/26のXLSXを模したデータ
        // verified_staff_blank_template.xlsx のタイトルやヘッダーを再現
        // parseXlsxBuffer に渡す代わりに、parseXlsxBuffer で検出されるロジックを直接テスト
        const mockSharedStrings = [
            "4月29日～5月26日 スタッフ希望勤務入力シート（希望勤務はプルダウンから選択してください）",
            "No", "氏名", "4/29", "4/30"
        ];
        const titleRegex = /(?:(\d{4})[年\/-])?(\d{1,2})月(\d{1,2})日[～〜~-](\d{1,2})月(\d{1,2})日/;
        let detected = null;
        for (const str of mockSharedStrings) {
            const m = str.match(titleRegex);
            if (m) {
                const y = m[1] ? parseInt(m[1], 10) : 2026;
                const mon = String(parseInt(m[2], 10)).padStart(2, '0');
                const day = String(parseInt(m[3], 10)).padStart(2, '0');
                detected = `${y}-${mon}-${day}`;
                break;
            }
        }
        log("3. Detected startDate=" + detected);
        if (detected !== '2026-04-29') throw new Error("Regex title detection failed: " + detected);

        // 日付を反映
        document.getElementById('termStartDate').value = detected;
        getTermInfo();

        // 佐藤健一(0) の希望データをインポート (replace モード)
        const importedItems = [
            { staffIdx: 0, dayIdx: 1, symbol: '休' },
            { staffIdx: 0, dayIdx: 2, symbol: '有' }
        ];

        applyScheduleImport(importedItems, 'replace');

        // 検証1: 期間とバッジ
        const curStart = document.getElementById('termStartDate').value;
        const curEnd = document.getElementById('termEndDateDisplay').textContent;
        const curBadge = document.getElementById('termTitleBadge').textContent;
        log("4. Dates: Start=" + curStart + ", End=" + curEnd + ", Badge=" + curBadge);

        if (curStart !== '2026-04-29') throw new Error('Start date not updated!');
        if (curEnd !== '2026-05-26') throw new Error('End date not updated!');
        if (!curBadge.includes('4/29～5/26')) throw new Error('Badge not updated!');

        // 検証2: ヘッダー
        const ths = document.querySelectorAll('#inputTableHead tr:nth-child(2) th');
        const d1Th = ths[5];
        const d28Th = ths[ths.length - 1];
        log("5. Header: Day1=" + d1Th.innerText.replace(/\n/g, ' ') + ", Day28=" + d28Th.innerText.replace(/\n/g, ' '));

        if (!d1Th.innerText.includes('4/29') || !d1Th.innerText.includes('水')) {
            throw new Error('Day1 header wrong: ' + d1Th.innerText);
        }
        if (!d28Th.innerText.includes('5/26') || !d28Th.innerText.includes('火')) {
            throw new Error('Day28 header wrong: ' + d28Th.innerText);
        }

        // 検証3: 古いサンプルデータ（鈴木美咲の5日目「有」など）が完全クリアされているか
        const cellSt2_d5 = document.querySelector('.day-cell[data-s="1"][data-d="4"]');
        log("6. Old sample check: Staff 2 Day 5 cell text='" + (cellSt2_d5 ? cellSt2_d5.innerText : 'null') + "'");
        if (cellSt2_d5 && cellSt2_d5.innerText !== '') {
            throw new Error('Old sample data still exists in cell! Text=' + cellSt2_d5.innerText);
        }

        // 検証4: 取り込んだ希望データのみが反映されているか
        const cellSt1_d2 = document.querySelector('.day-cell[data-s="0"][data-d="1"]');
        const cellSt1_d3 = document.querySelector('.day-cell[data-s="0"][data-d="2"]');
        log("7. Imported check: Staff 1 Day 2='" + (cellSt1_d2 ? cellSt1_d2.innerText : '') + "', Day 3='" + (cellSt1_d3 ? cellSt1_d3.innerText : '') + "'");

        if (!cellSt1_d2 || cellSt1_d2.innerText !== '休') throw new Error('Staff 1 Day 2 休 not applied');
        if (!cellSt1_d3 || cellSt1_d3.innerText !== '有') throw new Error('Staff 1 Day 3 有 not applied');

        document.getElementById('test-log').innerText = "SUCCESS_ALL_TESTS_PASSED\n" + logs.join("\n");
    } catch (e) {
        document.getElementById('test-log').innerText = "ERROR: " + e.message + "\n" + logs.join("\n");
    }
}
runTest();
</script>
</body>
</html>
