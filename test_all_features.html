<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>All Features Test</title>
</head>
<body>
    <div id="testStatus">TEST_RUNNING</div>
    <div id="testLogs"></div>

    <!-- index.htmlの全主要要素を含む完全なモック -->
    <iframe id="mainFrame" src="index.html" style="width: 1200px; height: 900px;"></iframe>

    <script>
        const logs = [];
        function log(msg) {
            logs.push(msg);
            document.getElementById('testLogs').innerText = logs.join('\n');
            console.log(msg);
        }

        window.addEventListener('load', async () => {
            const frame = document.getElementById('mainFrame');
            await new Promise(r => {
                if (frame.contentDocument && frame.contentDocument.readyState === 'complete') r();
                else frame.onload = r;
            });
            await new Promise(r => setTimeout(r, 800));

            const win = frame.contentWindow;
            const doc = frame.contentDocument;

            try {
                log('=== TEST 1: 日付変更と終了日・バッジの追従検証 ===');
                const dateInput = doc.getElementById('termStartDate');
                const endDisplay = doc.getElementById('termEndDateDisplay');
                const badge = doc.getElementById('termTitleBadge');
                log('1. 初期日付: ' + dateInput.value + ' -> 終了日: ' + endDisplay.textContent + ', バッジ: ' + badge.textContent);

                // 2026-05-01 に変更してみる (5/1～5/28)
                dateInput.value = '2026-05-01';
                dateInput.dispatchEvent(new win.Event('change'));
                await new Promise(r => setTimeout(r, 400));

                log('2. 変更後: ' + dateInput.value + ' -> 終了日: ' + endDisplay.textContent + ', バッジ: ' + badge.textContent);
                if (endDisplay.textContent !== '2026-05-28' || !badge.textContent.includes('5/1～5/28')) {
                    throw new Error('日付変更追従テスト失敗: 終了日=' + endDisplay.textContent + ', バッジ=' + badge.textContent);
                }
                log('✓ TEST 1 PASS: 日付変更と終了日・バッジの追従が完璧に動作！');

                log('=== TEST 2: 空白勤務表 (.xlsx) ダウンロード動作検証 ===');
                const blankBtn = doc.getElementById('downloadBlankTemplateBtn');
                let downloadedBlobName = null;
                const origCreateObjectURL = win.URL.createObjectURL;
                win.URL.createObjectURL = function(blob) {
                    downloadedBlobName = 'blob-ok';
                    return 'blob-ok';
                };
                blankBtn.click();
                await new Promise(r => setTimeout(r, 400));
                if (!downloadedBlobName) throw new Error('空白勤務表ダウンロードが発火しませんでした');
                log('✓ TEST 2 PASS: 空白勤務表(.xlsx)ダウンロードが正常に動作！');

                log('=== TEST 3: 希望入力 ＆ 制約チェック動作検証 ===');
                // スタッフ1(idx 0)の1日目(idx 0)に「休」を入力
                const cellS0D0 = doc.querySelector('#inputTableBody td.day-cell[data-s="0"][data-d="0"]');
                cellS0D0.click();
                await new Promise(r => setTimeout(r, 200));

                const validateInputBtn = doc.getElementById('validateInputBtn');
                validateInputBtn.click();
                await new Promise(r => setTimeout(r, 300));
                log('✓ TEST 3 PASS: 希望の制約チェックが正常に動作！');

                log('=== TEST 4: 基本勤務表 自動生成 ＆ タブ遷移検証 ===');
                const solveBtn = doc.getElementById('inputSolveBtn');
                solveBtn.click();
                await new Promise(r => setTimeout(r, 700));

                const activeTab = doc.querySelector('.tab-panel.active');
                log('Active tab after solve: ' + (activeTab ? activeTab.id : 'none'));
                if (!activeTab || activeTab.id !== 'outputTab') {
                    throw new Error('自動生成後に outputTab に切り替わっていません: ' + (activeTab ? activeTab.id : 'none'));
                }
                const outCell0 = doc.querySelector('#outputTableBody td.day-cell[data-s="0"][data-d="0"]');
                if (!outCell0) throw new Error('outputTableBody にセルが描画されていません');
                log('✓ TEST 4 PASS: 勤務表自動生成＆修正作業エリアへの遷移が正常に動作！');

                log('=== TEST 5: 特殊勤務割当 ＆ 最終チェック＆完成タブ遷移検証 ===');
                const assignSpecialBtn = doc.getElementById('outputAssignSpecialBtn');
                assignSpecialBtn.click();
                await new Promise(r => setTimeout(r, 700));

                const activeTab2 = doc.querySelector('.tab-panel.active');
                log('Active tab after assign special: ' + (activeTab2 ? activeTab2.id : 'none'));
                if (!activeTab2 || activeTab2.id !== 'checkTab') {
                    throw new Error('特殊勤務割当後に checkTab に切り替わっていません: ' + (activeTab2 ? activeTab2.id : 'none'));
                }
                log('✓ TEST 5 PASS: 特殊勤務割当＆最終チェック＆完成タブへの遷移が正常に動作！');

                log('=== TEST 6: Excelダウンロード (.xls) 動作検証 ===');
                let downloadedXls = false;
                win.URL.createObjectURL = function(blob) {
                    downloadedXls = true;
                    return 'blob-xls-ok';
                };
                const downloadExcelBtn = doc.getElementById('downloadExcelBtn');
                if (downloadExcelBtn) {
                    downloadExcelBtn.click();
                    await new Promise(r => setTimeout(r, 300));
                    if (!downloadedXls) throw new Error('Excelダウンロードボタンが発火しませんでした');
                    log('✓ TEST 6 PASS: 確定勤務表Excelダウンロードが正常に動作！');
                }

                log('=== TEST 7: 期間切替と保存復元の完全性検証 ===');
                // 2026-05-01 から 2026-04-01 に切り替え
                dateInput.value = '2026-04-01';
                dateInput.dispatchEvent(new win.Event('change'));
                await new Promise(r => setTimeout(r, 500));

                log('Switched to 2026-04-01: ' + endDisplay.textContent + ', badge: ' + badge.textContent);
                if (endDisplay.textContent !== '2026-04-28' || !badge.textContent.includes('4/1～4/28')) {
                    throw new Error('4/1～4/28 への再切り替えが失敗しました');
                }

                // 再度 2026-05-01 に戻してデータが復元されるか
                const savedTermsSelect = doc.getElementById('savedTermsSelect');
                savedTermsSelect.value = '2026-05-01';
                savedTermsSelect.dispatchEvent(new win.Event('change'));
                await new Promise(r => setTimeout(r, 500));

                log('Switched back to 2026-05-01: ' + endDisplay.textContent + ', badge: ' + badge.textContent);
                if (endDisplay.textContent !== '2026-05-28' || !badge.textContent.includes('5/1～5/28')) {
                    throw new Error('5/1～5/28 へのドロップダウン復元が失敗しました');
                }
                log('✓ TEST 7 PASS: 期間別保存＆相互切替・復元が完璧に動作！');

                log('=== ALL_SYSTEM_FEATURES_VERIFIED_SUCCESSFULLY ===');
                document.getElementById('testStatus').innerText = 'ALL_SYSTEM_FEATURES_VERIFIED_SUCCESSFULLY';
            } catch(e) {
                log('ERROR: ' + e.message);
                document.getElementById('testStatus').innerText = 'FAILED: ' + e.message;
            }
        });
    </script>
</body>
</html>
