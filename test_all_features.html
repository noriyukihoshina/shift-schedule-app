<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>総合機能テスト（オフセット増減・Pプロテクト・4セクションフッター）</title>
</head>
<body>
    <div id="testStatus" style="font-size: 20px; font-weight: bold; padding: 20px;">テスト実行中...</div>
    <div id="testResults" style="font-family: monospace; white-space: pre-wrap; padding: 20px;"></div>

    <!-- アプリ本体のiframe -->
    <iframe id="appFrame" src="index.html" style="width: 1200px; height: 800px; border: 1px solid #ccc;"></iframe>

    <script>
        const log = (msg) => {
            const el = document.getElementById('testResults');
            el.textContent += msg + '\n';
            console.log(msg);
        };

        window.addEventListener('load', () => {
            const frame = document.getElementById('appFrame');
            frame.onload = async () => {
                const doc = frame.contentDocument;
                const win = frame.contentWindow;

                try {
                    log('=== 総合機能自動テスト開始 ===');

                    // テスト1: エラーなしロード確認
                    log('[TEST 1] アプリケーション基本ロード確認');
                    if (!doc.getElementById('termStartDate')) throw new Error('termStartDateが存在しません');
                    if (!doc.getElementById('inputTableHead')) throw new Error('inputTableHeadが存在しません');
                    log('  -> PASS: アプリ基本ロード正常');

                    // テスト2: 3つのパレットに「P」ボタンが存在するか確認
                    log('[TEST 2] 記号パレットの「P」ボタン確認');
                    const inputPBtn = doc.querySelector('#inputTab .palette-btn-protect');
                    const outputPBtn = doc.querySelector('#outputTab .palette-btn-protect');
                    const checkPBtn = doc.querySelector('#checkTab .palette-btn-protect');
                    if (!inputPBtn || inputPBtn.dataset.sym !== 'P') throw new Error('入力パレットにPボタンがありません');
                    if (!outputPBtn || outputPBtn.dataset.sym !== 'P') throw new Error('修正パレットにPボタンがありません');
                    if (!checkPBtn || checkPBtn.dataset.sym !== 'P') throw new Error('チェックパレットにPボタンがありません');
                    log('  -> PASS: 3タブすべてにP（プロテクト）ボタン確認完了');

                    // テスト3: 日別オフセット（+ / -）コントロールの存在確認
                    log('[TEST 3] 日別オフセット（+ / -）コントロール確認');
                    const offsetCtrls = doc.querySelectorAll('#inputTableHead .day-offset-ctrl');
                    if (offsetCtrls.length !== 28) throw new Error(`日別オフセットコントロール数が28個ではありません (現在: ${offsetCtrls.length})`);
                    log('  -> PASS: 全28日分のオフセットコントロール確認完了');

                    // テスト4: オフセット増減操作のテスト
                    log('[TEST 4] オフセット増減クリック操作テスト');
                    const firstPlusBtn = offsetCtrls[0].querySelector('.offset-plus');
                    const firstValSpan = offsetCtrls[0].querySelector('.day-offset-val');
                    firstPlusBtn.click();
                    firstPlusBtn.click();
                    if (firstValSpan.textContent.trim() !== '+2') throw new Error(`+2をクリック後の表示が不正です: ${firstValSpan.textContent}`);
                    
                    const firstMinusBtn = offsetCtrls[0].querySelector('.offset-minus');
                    firstMinusBtn.click();
                    if (firstValSpan.textContent.trim() !== '+1') throw new Error(`-1をクリック後の表示が不正です: ${firstValSpan.textContent}`);
                    log('  -> PASS: オフセット増減クリック(+2 -> +1)正常');

                    // テスト5: 勤務表自動生成の実行
                    log('[TEST 5] 勤務表自動生成実行');
                    const solveBtn = doc.getElementById('inputSolveBtn');
                    solveBtn.click();

                    // 自動生成完了待ち（非同期）
                    await new Promise(resolve => setTimeout(resolve, 800));

                    // テスト6: フッターに出勤合計およびPT A, PT B, OT A, OT B の4セクション行が存在するか確認
                    log('[TEST 6] フッターのセクション別集計行確認');
                    const footRows = doc.querySelectorAll('#outputTableFoot tr');
                    const rowTexts = Array.from(footRows).map(r => r.textContent);
                    log(`  フッター行数: ${footRows.length}`);
                    
                    const hasPTA = rowTexts.some(t => t.includes('PT A 出勤'));
                    const hasPTB = rowTexts.some(t => t.includes('PT B 出勤'));
                    const hasOTA = rowTexts.some(t => t.includes('OT A 出勤'));
                    const hasOTB = rowTexts.some(t => t.includes('OT B 出勤'));
                    const hasWorkTotal = rowTexts.some(t => t.includes('出勤人数合計'));

                    if (!hasWorkTotal) throw new Error('出勤人数合計行がありません');
                    if (!hasPTA || !hasPTB || !hasOTA || !hasOTB) throw new Error('4セクション(PT A, PT B, OT A, OT B)の出勤行が不足しています');
                    log('  -> PASS: 4セクション出勤集計行(PT A, PT B, OT A, OT B)すべて存在確認');

                    // テスト7: 「P」ボタンによるセルのプロテクトトグルテスト
                    log('[TEST 7] 「P」ボタンによるプロテクトトグルテスト');
                    outputPBtn.click(); // Pボタンを選択
                    const firstWorkCell = doc.querySelector('#outputTableBody .day-cell[data-s="0"][data-d="1"]');
                    const initialFixed = firstWorkCell.classList.contains('fixed-cell');
                    firstWorkCell.click(); // クリックしてプロテクトON
                    const afterFixed = firstWorkCell.classList.contains('fixed-cell');
                    if (initialFixed === afterFixed) throw new Error('Pボタンクリックでfixed-cellクラスがトグルされませんでした');
                    log(`  -> PASS: Pボタンによるセルプロテクトトグル正常 (初期:${initialFixed} -> クリック後:${afterFixed})`);

                    log('=== 全テスト合格 (ALL PASS)! ===');
                    document.getElementById('testStatus').textContent = '✅ 全テスト合格 (ALL PASS)';
                    document.getElementById('testStatus').style.color = '#16a34a';

                } catch (e) {
                    log('❌ ERROR: ' + e.message);
                    document.getElementById('testStatus').textContent = '❌ テスト失敗: ' + e.message;
                    document.getElementById('testStatus').style.color = '#dc2626';
                }
            };
        });
    </script>
</body>
</html>
