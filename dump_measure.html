<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body style="margin:0; padding:20px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
<table style="border-collapse:collapse; table-layout:fixed;">

                    <button type="button" class="day-offset-btn offset-plus" style="width:13px; height:16px; font-size:10px; line-height:1; padding:0;">+</button>
                </div>
            </th>
            <th class="col-day-fixed" style="width:52px; min-width:52px; max-width:52px; background:#e0f2fe; font-size:0.78rem; padding:4px 2px; color:#1e293b; border:1px solid #bae6fd; text-align:center; white-space:nowrap;">12/31</th>

        </tr>
    </tbody>

window.onload = () => {
    const ths = document.querySelectorAll('th');
    const label1231 = document.querySelector('.day-label');
    const ctrl = document.querySelector('.day-offset-ctrl');
    const result = {
        th1_offsetWidth: ths[0].offsetWidth,
        th1_scrollWidth: ths[0].scrollWidth,
