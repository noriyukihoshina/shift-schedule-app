<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ソルバー自動検証テストランナー</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0f172a; color: #f8fafc; }
        .pass { color: #4ade80; font-weight: bold; }
        .fail { color: #f87171; font-weight: bold; }
        .section { margin-top: 20px; border-top: 1px solid #334155; padding-top: 10px; }
    </style>
</head>
<body>
    <h2>🧪 勤務予定表ソルバー 自動検証テスト</h2>
    <div id="results">テスト実行中...</div>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const results = document.getElementById('results');
            if (results) {
                results.innerHTML += `<div class="fail">エラー検知: ${msg} at line ${lineNo}:${columnNo}</div>`;
            }
        };
    </script>
    <script src="solver.js"></script>
    <script>
        // 即時実行
        (function() {
            const results = document.getElementById('results');
            let log = '';

            const origLog = console.log;
            console.log = function(...args) {
                origLog.apply(console, args);
                log += `<div>[CONSOLE] ${args.join(' ')}</div>`;
            };

            function assert(desc, condition) {
                if (condition) {
                    console.log(`[PASS] ${desc}`);
                    log += `<div><span class="pass">✔ PASS</span>: ${desc}</div>`;
                } else {
                    console.log(`[FAIL] ${desc}`);
                    log += `<div><span class="fail">✘ FAIL</span>: ${desc}</div>`;
                }
            }

            // 50名モックデータの生成（現場実態: 1〜9番目のみ8時可能）
            const staffList = [];
            for (let i = 1; i <= 50; i++) {
                staffList.push({
                    id: i,
                    name: `スタッフ${i}`,
                    can8: (i <= 9), // ★ 現場実態: 1〜9番目のみ8時可能
                    noEarly: (i === 13),
                    noLate: (i === 13),
                    noEve: (i === 13 || i === 15 || i === 16),
                    prevDays: ['○', '○', '休', '○', '○'],
                    days: new Array(28).fill('')
                });
            }

            // 希望休とリフレッシュ休を散らす（8時可スタッフの希望休も適度に分散）
            staffList[5].days[6] = '上1'; staffList[5].days[7] = '上2'; staffList[5].days[8] = '上3'; staffList[5].days[9] = '上4'; staffList[5].days[10] = '上5';
            staffList[18].days[15] = '下1'; staffList[18].days[16] = '下2'; staffList[18].days[17] = '下3';
            // ★ 半日勤務記号のテスト（数か月に一度の希望）
            staffList[2].days[4] = '○/休';
            staffList[3].days[10] = '休/○';
            staffList[4].days[18] = '○/有';
            staffList[7].days[22] = '有/○';

            staffList.forEach((s, idx) => {
                if (!s.days[(idx * 3 + 2) % 27]) s.days[(idx * 3 + 2) % 27] = '休';
                if (!s.days[(idx * 5 + 7) % 27]) s.days[(idx * 5 + 7) % 27] = '休';
            });

            try {
                const startTime = performance.now();
                const scheduler = new ShiftScheduler(staffList);
                const res = scheduler.solve();
                const elapsed = (performance.now() - startTime).toFixed(1);

                log += `<div class="section"><b>計算時間: ${elapsed} ms</b></div>`;
                if (!res.success && res.errors) {
                    log += `<div class="fail">エラー詳細: ${res.errors.join('<br>')}</div>`;
                }
                assert("ソルバー実行結果が成功（success === true）であること", res.success === true);

            if (res.success) {
                // 1. 各日の特殊勤務枠チェック
                let specialAllOk = true;
                for (let d = 0; d < 28; d++) {
                    const dStat = res.stats.daily[d];
                    if (dStat.early !== 3 || dStat.late !== 1 || dStat.eve !== 2 || dStat.h8 !== 1) {
                        specialAllOk = false;
                        log += `<div>[${d+1}日目] 早:${dStat.early}/3, 遅:${dStat.late}/1, E:${dStat.eve}/2, 8時:${dStat.h8}/1</div>`;
                    }
                }
                assert("全28日間で毎日「早3名 / 遅1名 / E2名 / 8時1名」が厳密に配置されていること", specialAllOk);

                // 2. 特殊勤務翌日休制約チェック
                let nextDayHolidayOk = true;
                for (let s = 0; s < 50; s++) {
                    for (let d = 0; d < 27; d++) {
                        const sym = res.grid[s][d].symbol;
                        if (['早', '遅', 'E'].includes(sym)) {
                            const nextSym = res.grid[s][d + 1].symbol;
                            if (!isHolidaySymbol(nextSym)) {
                                nextDayHolidayOk = false;
                                log += `<div>スタッフ${s+1}の${d+1}日目(${sym})の翌日(${d+2}日目)が勤務(${nextSym})</div>`;
                            }
                        }
                    }
                }
                assert("「早・遅・E」を割り当てた翌日は必ず休日（休/有/上/下）であること", nextDayHolidayOk);

                // 3. 単発日勤チェック (休 - ○ - 休 はソフト制約)
                let singleWorkCount = 0;
                for (let s = 0; s < 50; s++) {
                    const seq = [...staffList[s].prevDays, ...res.grid[s].map(c => c.symbol)];
                    for (let idx = 1; idx < seq.length - 1; idx++) {
                        if (isHolidaySymbol(seq[idx-1]) && seq[idx] === '○' && isHolidaySymbol(seq[idx+1])) {
                            singleWorkCount++;
                        }
                    }
                }
                assert(`単発日勤（休 - ○ - 休）の抑制（ソフト制約）: 残り${singleWorkCount}箇所（実用上問題なし）`, singleWorkCount <= 15);

                // 4. 6連続勤務禁止チェック (最大5連勤)
                let maxConsecutiveOk = true;
                for (let s = 0; s < 50; s++) {
                    const seq = [...staffList[s].prevDays, ...res.grid[s].map(c => c.symbol)];
                    let c = 0;
                    for (let idx = 0; idx < seq.length; idx++) {
                        if (isWorkSymbol(seq[idx])) {
                            c++;
                            if (c > 5) {
                                maxConsecutiveOk = false;
                                log += `<div>スタッフ${s+1}が${c}連勤</div>`;
                            }
                        } else {
                            c = 0;
                        }
                    }
                }
                assert("最大連続勤務日数が5日以内（6連勤禁止）であること（月またぎ含む）", maxConsecutiveOk);

                // 5. フラグ制限遵守チェック
                let flagsOk = true;
                for (let s = 0; s < 50; s++) {
                    const staff = staffList[s];
                    for (let d = 0; d < 28; d++) {
                        const sym = res.grid[s][d].symbol;
                        if (sym === '8時' && !staff.can8) flagsOk = false;
                        if (sym === '早' && staff.noEarly) flagsOk = false;
                        if (sym === '遅' && staff.noLate) flagsOk = false;
                        if (sym === 'E' && staff.noEve) flagsOk = false;
                    }
                }
                assert("各スタッフの「8時可」「早番不可」「遅番不可」「E不可」フラグが厳密に守られていること", flagsOk);

                // 6. 事前入力枠の完全保持チェック（ロック検証）
                let fixedKept = true;
                for (let s = 0; s < 50; s++) {
                    for (let d = 0; d < 28; d++) {
                        const original = staffList[s].days[d];
                        if (original && original !== '') {
                            if (res.grid[s][d].symbol !== original) {
                                fixedKept = false;
                            }
                        }
                    }
                }
                assert("事前入力枠（希望勤務）が上書きされず完全ロック・保持されていること", fixedKept);

                // 7. 有給休暇・リフレッシュ休暇のカウント検証
                const totalPaid = res.stats.staffStats.reduce((sum, s) => sum + s.paidDays, 0);
                assert(`有給休暇（有）が集計カウントされていること (合計: ${totalPaid}日)`, true);

                // 8. 公休数の検証（半日公休を含む全スタッフがジャスト8.0日またはリフレッシュ・有休相殺内に収まっていること）
                let holidaysExact = true;
                for (let s = 0; s < 50; s++) {
                    const st = res.stats.staffStats[s];
                    // 公休＋有休＋リフ＋出勤 ＝ 28
                    const totalDays = st.workDays + st.offDays + st.paidDays + st.refDays;
                    if (Math.abs(totalDays - 28) > 0.001) {
                        holidaysExact = false;
                        log += `<div>スタッフ${s+1}の合計日数が28日と不一致: ${totalDays}日</div>`;
                    }
                    if (Math.abs(st.offDays - 8.0) > 0.001) {
                        holidaysExact = false;
                        const seq = res.grid[s].map(c => c.symbol).join(',');
                        log += `<div>スタッフ${s+1}の公休数が8.0日と不一致: ${st.offDays}日 [${seq}]</div>`;
                    }
                }
                assert("全スタッフの公休数が規定値（ジャスト8.0日、半日公休の端数自動補正完了）であること", holidaysExact);
            }
            } catch(e) {
                log += `<div class="fail">例外発生: ${e.message}<br>${e.stack}</div>`;
            }

            results.innerHTML = log;
        })();
    </script>
</body>
</html>
