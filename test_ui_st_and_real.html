<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UI ST and Real Work Test</title>
</head>
<body>
<div id="results"></div>
<script src="solver.js?v=20261114_170810"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
    try {
        console.log("Starting ST and Real Work Verification...");
        const numDays = 28;
        // スタッフ36名
        // s_0: PT A, isHalf: true（時短 0.5）
        // s_1: PT A, isHalf: false
        // s_2: OT A, isHalf: true（時短 0.5）
        // s_3: OT A, isHalf: false
        // s_4: PT B, isHalf: false
        // s_5: OT B, isHalf: false
        const staffList = [];
        for (let i = 0; i < 36; i++) {
            let sec = 'PT A';
            if (i >= 9 && i < 18) sec = 'OT A';
            else if (i >= 18 && i < 27) sec = 'PT B';
            else if (i >= 27) sec = 'OT B';

            staffList.push({
                id: `s_${i}`,
                name: `スタッフ${i+1}`,
                jobTitle: sec.startsWith('PT') ? 'PT' : 'OT',
                section: sec,
                isHalf: (i === 0 || i === 9), // s_0 (PT A) と s_9 (OT A) を時短0.5に設定
                isFirstYear: (i % 9 === 0),
                canSched: (i % 9 >= 1 && i % 9 < 3),
                can8: (i % 9 >= 3 && i % 9 < 5),
                isSectionChief: (i === 1),
                isUnused: false,
                noEarly: false,
                noLate: false,
                noEve: false,
                prevDays: ['', '', '', '', ''],
                days: new Array(numDays).fill('')
            });
        }

        // STスタッフデータ（モック: ST 4名、1名時短0.5）
        // Day 0: ST全4名出勤 (3名×1.0 + 1名×0.5 = 3.5 実数)
        const mockStDailyWork = new Array(numDays).fill(3.5);

        const scheduler = new ShiftScheduler(staffList, {
            numDays: numDays,
            standardHolidays: 8.0,
            stDailyWork: mockStDailyWork
        });

        const baseRes = scheduler.solveBaseSchedule();
        const stats = scheduler.calculateStats();

        // Day 0 のセクション出勤実数を確認
        const d0Stat = stats.daily[0];
        console.log("Day 0 Stats:", {
            totalWork: d0Stat.totalWork,
            realWork: d0Stat.realWork,
            ptA: d0Stat.sectionWork['PT A'],
            otA: d0Stat.sectionWork['OT A'],
            ptB: d0Stat.sectionWork['PT B'],
            otB: d0Stat.sectionWork['OT B'],
            st: d0Stat.sectionWork['ST']
        });

        // s_0 (PT A, isHalf: true) を○にする -> 実数 0.5
        // s_1 (PT A, isHalf: false) を○にする -> 実数 1.0
        // s_2 (PT A, isHalf: false) を半休にする -> 実数 0.5
        // s_9 (OT A, isHalf: true) を半休にする -> 実数 0.25
        scheduler.grid[0][0] = { symbol: '○', isFixed: false };
        scheduler.grid[1][0] = { symbol: '○', isFixed: false };
        scheduler.grid[2][0] = { symbol: '○/休', isFixed: false };
        scheduler.grid[9][0] = { symbol: '○/休', isFixed: false };

        const statsAfter = scheduler.calculateStats();
        const d0 = statsAfter.daily[0];

        console.log("PT A Real (Expected 0.5 + 1.0 + 0.5 = 2.0):", d0.sectionWork['PT A']);
        console.log("OT A Real (Expected 0.25):", d0.sectionWork['OT A']);
        console.log("ST Real (Expected 3.5):", d0.sectionWork['ST']);

        const ptAOk = (d0.sectionWork['PT A'] === 2.0);
        const otAOk = (d0.sectionWork['OT A'] === 0.25);
        const stOk = (d0.sectionWork['ST'] === 3.5);

        if (ptAOk && otAOk && stOk) {
            console.log("TEST_REAL_WORK_SECTIONS_PASSED");
        } else {
            console.error("TEST_REAL_WORK_SECTIONS_FAILED", { ptAOk, otAOk, stOk });
        }
    } catch (e) {
        console.error("Test Exception:", e.message, e.stack);
    }
});
</script>
</body>
</html>
