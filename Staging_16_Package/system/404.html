<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ページ移動中...</title>
    <script>
        (function() {
            try {
                var path = decodeURIComponent(window.location.pathname);
                if (path.indexOf('1階') !== -1 || path.indexOf('1f') !== -1 || path.indexOf('1F') !== -1) {
                    window.location.replace('/1f.html');
                    return;
                }
                if (path.indexOf('2階') !== -1 || path.indexOf('2f') !== -1 || path.indexOf('2F') !== -1) {
                    window.location.replace('/2f.html');
                    return;
                }
                if (path.indexOf('3階') !== -1 || path.indexOf('3f') !== -1 || path.indexOf('3F') !== -1) {
                    window.location.replace('/3f.html');
                    return;
                }
                if (path.indexOf('南') !== -1 || path.indexOf('south') !== -1) {
                    window.location.replace('/south.html');
                    return;
                }
                if (path.indexOf('生活') !== -1 || path.indexOf('life') !== -1) {
                    window.location.replace('/life.html');
                    return;
                }
                if (path.indexOf('マスター') !== -1 || path.indexOf('master') !== -1) {
                    window.location.replace('/index.html');
                    return;
                }
                if (path.indexOf('ST') !== -1 || path.indexOf('st') !== -1) {
                    window.location.replace('/ST.html');
                    return;
                }
            } catch(e) {}
            // それ以外はトップページ（マスターテーブル）へ
            window.location.replace('/index.html');
        })();
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px; color: #475569;">
    <p>該当するページへ自動移動しています...</p>
    <p><a href="/index.html">自動で移動しない場合はこちらをクリックしてください</a></p>
</body>
</html>
